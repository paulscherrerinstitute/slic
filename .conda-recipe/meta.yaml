{% set data = load_setup_py_data() %}

package:
    name: slic
    version: {{ data["version"] }}

about:
   home: {{ data["url"] }}
   summary: {{ data["description"] }}

source:
    path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
    host:
        - python
        - pip
        - setuptools
    run:
        - python
        - bsread
        - cam_server_client
        - colorama
        - cta_lib
        - data_api
        - dbus-python
        - elog
        - fuzzywuzzy
        - h5py
        - ipython
        - jungfrau_utils >=3.16.0
        - logzero
        - matplotlib
        - numpy
        - passlib
        - pcaspy
        - pika
        - pyepics >=3.4.2
        - pyzmq
        - requests
        - rich
        - tqdm
        - wxpython
        - yaspin
    run_constrained:
        - yokai


